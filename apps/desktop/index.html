<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/Geist/Geist-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/Geist/Geist-Italic-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Tauri + React + Typescript</title>
    <script>
      try {
        var __theme = localStorage.getItem("mponline-theme");
        if (
          __theme === "dark" ||
          (!__theme &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
