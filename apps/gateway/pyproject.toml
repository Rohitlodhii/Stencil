[project]
name = "gateway"
version = "0.1.0"
description = "MPOnline gateway (routes to auth / exam / scanner services)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
