[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend application"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40.0",
  "fastapi>=0.116.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "numpy>=2.5.3",
  "opencv-python-headless>=5.0.0.93",
  "openai>=1.0.0",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.1.0",
  "pymupdf>=1.24.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.32",
  "uvicorn>=0.34.0",
]

[project.scripts]
sheet-scanner = "sheet_scanner.main:main"

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
force-include = { "src/sheet_scanner" = "sheet_scanner" }

[tool.hatch.build.targets.wheel]
packages = ["app"]
