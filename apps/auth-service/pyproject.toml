[project]
name = "auth-service"
version = "0.1.0"
description = "MPOnline auth service (coordinators + teachers, Postgres)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.11.0",
  "email-validator>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "pyjwt>=2.8.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
